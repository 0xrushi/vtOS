# File manager for a 320x240 screen: list view, no side pane or status bar,
# small icons. (Copied to both the "default" and "LXDE" pcmanfm profiles.)
[config]
bUseTrash=0
[ui]
always_show_tabs=0
show_statusbar=0
side_pane_mode=hidden;places
view_mode=list
toolbar=navigation;
show_hidden=0
big_icon_size=24
small_icon_size=16
pane_icon_size=16
thumbnail_size=48
