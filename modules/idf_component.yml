dependencies:
  espressif/mdns: "~1.1.0"
  espressif/tinyusb:
    rules:
      - if: "target in [esp32s2, esp32s3, esp32p4]"
    # Temporary workaround for https://github.com/hathach/tinyusb/issues/3154
    # Can be removed once fix is released in espressif/tinyusb
    git: https://github.com/micropython/tinyusb-espressif.git
    version: cherrypick/dwc2_zlp_fix
  espressif/esp_hosted:
    rules:
      - if: "target == esp32p4"
    version: "2.7.0"
  espressif/esp_wifi_remote:
    rules:
      - if: "target == esp32p4"
    version: "0.15.2"
  espressif/lan867x:
    version: "~1.0.0"
    rules:
      - if: "target == esp32"
  idf:
    version: ">=5.3.0"

  chmorgan/esp-libhelix-mp3: "^1.0.3"
  espressif/es7210: "^1.0.1"
  jgromes/radiolib: "^7.7.1"

  wolfssl/wolfssl: "5.8.2"
  wolfssl/wolfssh: "1.4.20"

  # Keep both components at the same revision; MicroLink's WireGuard component
  # is nested and isn't discovered automatically by IDF Component Manager.
  microlink:
    git: https://github.com/CamM2325/microlink.git
    version: 216da3300f0493b0860247d43f7af5ce29df63a5
    path: components/microlink
  wireguard_lwip:
    git: https://github.com/CamM2325/microlink.git
    version: 216da3300f0493b0860247d43f7af5ce29df63a5
    path: components/microlink/components/wireguard_lwip
